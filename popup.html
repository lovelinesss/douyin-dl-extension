<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 380px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        font-size: 13px;
        color: #1f1f1f;
        background: #fff;
      }
      h1 {
        font-size: 14px;
        font-weight: 500;
        margin: 0 0 12px;
      }
      .ver {
        font-size: 11px;
        font-weight: 400;
        color: #aaa;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      label {
        width: 76px;
        color: #666;
        flex-shrink: 0;
      }
      input {
        flex: 1;
        padding: 4px 6px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        font-size: 13px;
        font-family: inherit;
      }
      .stats {
        display: flex;
        gap: 12px;
        padding: 8px 0;
        border-top: 1px solid #eee;
        border-bottom: 1px solid #eee;
        color: #666;
      }
      .stats b {
        color: #1f1f1f;
        font-weight: 500;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 220px;
        overflow-y: auto;
      }
      li {
        padding: 6px 0;
        border-bottom: 1px solid #f5f5f5;
        font-size: 12px;
        line-height: 1.5;
      }
      .name {
        word-break: break-all;
      }
      .meta {
        color: #999;
      }
      .st-done {
        color: #1d9e75;
      }
      .st-failed {
        color: #d85a30;
      }
      .st-downloading {
        color: #378add;
      }
      .st-queued {
        color: #888;
      }
      .empty {
        color: #aaa;
        padding: 16px 0;
        text-align: center;
      }
      button {
        margin-top: 10px;
        padding: 5px 12px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        background: #fff;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #f5f5f5;
      }
      .hint {
        color: #aaa;
        font-size: 12px;
        margin-top: 10px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>抖音下载助手 <span id="ver" class="ver"></span></h1>

    <div class="row">
      <label>保存子目录</label>
      <input id="subdir" placeholder="留空则存到下载目录" />
    </div>
    <div class="row">
      <label>同时下载</label>
      <input id="concurrency" type="number" min="1" max="10" />
    </div>

    <div class="stats">
      <span>队列 <b id="s-queued">0</b></span>
      <span>进行中 <b id="s-active">0</b></span>
      <span>完成 <b id="s-done">0</b></span>
      <span>失败 <b id="s-failed">0</b></span>
    </div>

    <ul id="list"></ul>
    <div id="empty" class="empty">暂无下载任务</div>

    <button id="clear">清除已完成</button>
    <div class="hint">在抖音网页版点视频上的下载按钮即可使用。下载由浏览器下载管理器接管。</div>

    <script src="popup.js"></script>
  </body>
</html>
